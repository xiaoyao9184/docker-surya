

services:
  labelstudio:
    image: heartexlabs/label-studio
    environment:
      - LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK=true
      - LABEL_STUDIO_USERNAME=label@localhost
      - LABEL_STUDIO_PASSWORD=label.123
      - LABEL_STUDIO_USER_TOKEN=label-token
    ports:
      - "8080:8080"
    container_name: label-studio

  surya_llm:
    profiles:
      - vllm
    image: vllm/vllm-openai:v0.20.1
    container_name: surya_ocr_llm
    command:
      - "--model"
      - "datalab-to/surya-ocr-2"
      - "--revision"
      - "3b3d4cd"
      - "--no-enforce-eager"
      - "--max-num-seqs"
      - "24"
      - "--dtype"
      - "bfloat16"
      - "--max-model-len"
      - "18000"
      - "--max-num-batched-tokens"
      - "8192"
      - "--gpu-memory-utilization"
      - "0.85"
      - "--enable-prefix-caching"
      - "--mm-processor-kwargs"
      - '{"min_pixels": 3136, "max_pixels": 6291456}'
      - "--served-model-name"
      - "datalab-to/surya-ocr-2"
      - "--speculative-config"
      - '{"method": "mtp", "num_speculative_tokens": 2}'
    environment:
      - HF_HUB_OFFLINE=true
    ports:
      - 8000
    volumes:
      - ./../../cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [ gpu ]

  surya_label:
    image: xiaoyao9184/surya:0.21.1
    container_name: surya-ocr-label
    working_dir: /workspace/label
    command: label-studio-ml start --root-dir /workspace label
    environment:
      - LABEL_STUDIO_API_KEY=label-token
      - TORCH_DEVICE=cuda
      - HF_HUB_OFFLINE=true
      - DETECTOR_MODEL_CHECKPOINT=/root/.cache/datalab/models/text_detection/2025_05_07
      - SURYA_GGUF_LOCAL_MODEL_PATH=/root/.cache/huggingface/hub/models--datalab-to--surya-ocr-2-gguf/snapshots/6a3a4c30e5e74446d4f8b6afd05b2f2da970f470/surya-2.gguf
      - SURYA_GGUF_LOCAL_MMPROJ_PATH=/root/.cache/huggingface/hub/models--datalab-to--surya-ocr-2-gguf/snapshots/6a3a4c30e5e74446d4f8b6afd05b2f2da970f470/surya-2-mmproj.gguf
      - SURYA_INFERENCE_BACKEND=${SURYA_INFERENCE_BACKEND:-}
      - SURYA_INFERENCE_URL=${SURYA_INFERENCE_URL:-}
    ports:
      - "9090:9090"
    volumes:
      - ./../../cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [ gpu ]
